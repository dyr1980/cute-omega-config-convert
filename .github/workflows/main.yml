name: Deploy to GitHub Pages
permissions:
  contents: write

on:
  schedule:
    # - cron: "0,30 * * * *" # 在每小时的00分和30分运行
    - cron: "0 0/8 * * *" # 每8小时运行
  workflow_dispatch: # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global pull.rebase false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run config converting script
        run: python src/main.py --dns

      - name: Commit refreshed fallback config
        # 这一步是尝试把生成的兜底配置存回你当前的代码库
        run: |
          git add assets/final_config.json
          git diff --staged --quiet || git commit -m "chore: 刷新回退配置（最后一次成功产物）"
          # 你的主分支是 main
          git push origin HEAD:main || echo "::warning::main 受保护或无法推送，未能更新回退配置（不影响 Pages 发布）"

      - name: Checkout Pages repository
        uses: actions/checkout@v5
        with:
          # 👇 修改点 1：改成了你自己的 Pages 仓库
          repository: dyr1980/cute-omega-cute-omega.github.io
          token: ${{ secrets.PAT }}
          path: pages-repo

      - name: Copy and commit to Pages repo
        run: |
          mkdir -p pages-repo/other-assets
          cp assets/final_config.json pages-repo/other-assets/ds-config.json
          cp assets/final_config_dns.json pages-repo/other-assets/ds-config-dns.json
          cd pages-repo
          # 👇 修改点 2：确保拉取的是你仓库的 master 分支
          git checkout master || git checkout -b master
          git add other-assets/ds-config.json other-assets/ds-config-dns.json || true
          git commit -m "Update ds-config configs" || echo "No changes to commit"
          git pull origin master --no-edit || true
          git push origin master
